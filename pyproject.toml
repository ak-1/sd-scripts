[project]
name = "sd-scripts"
version = "0.9.1"
requires-python = ">=3.11,<3.12"
dependencies = [
    "accelerate==1.6.0",
    "bitsandbytes>=0.47.0",
    "diffusers[torch]==0.32.1",
    "einops==0.7.0",
    "ftfy==6.3.1",
    "huggingface-hub==0.34.3",
    "imagesize==1.4.1",
    "lion-pytorch==0.2.3",
    "numpy>=2.3.2",
    "opencv-python==4.10.0.84",
    "prodigy-plus-schedule-free==1.9.2",
    "prodigyopt==1.1.2",
    "pytorch-optimizer==3.7.0",
    "rich==14.1.0",
    "safetensors==0.4.5",
    "schedulefree==1.4",
    "sentencepiece==0.2.1",
    "tensorboard>=2.20.0",
    "toml==0.10.2",
    "transformers==4.54.1",
    "voluptuous==0.15.2",
    "torch",
    "torchvision",
    "torchaudio"
]

# [tool.uv]
# prerelease = "allow"

[tool.uv.sources]
torch = { index  = "pytorch" }
torchvision = { index  = "pytorch" }
torchaudio = { index  = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
# url = "https://download.pytorch.org/whl/cpu"
url = "https://download.pytorch.org/whl/cu121"
